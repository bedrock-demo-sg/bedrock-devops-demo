# Quality gates on every pull request into main. All jobs must pass before merge (branch protection).
name: PR validation

on:
  pull_request:
    branches: [integration, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  traceability:
    name: traceability
    runs-on: ubuntu-latest
    steps:
      - name: Pull request title carries a work item key (for example W-1234)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITLE" =~ ^W-[0-9]+[[:space:]] ]]; then
            echo "OK: $TITLE"
          else
            echo "::error title=Missing work item key::Start the pull request title with a work item key, for example 'W-1234 Add Client Review object'."
            exit 1
          fi

  code-analyzer:
    name: code-analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install @salesforce/plugin-code-analyzer
          sf --version
      - name: Static analysis (fails on Critical or High)
        run: |
          sf code-analyzer run --config-file code-analyzer.yml --target force-app \
            --severity-threshold 2 --view table \
            --output-file code-analyzer-results.html --output-file code-analyzer-results.sarif
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-results
          path: code-analyzer-results.*

  validate:
    name: validate
    needs: [traceability, code-analyzer]
    runs-on: ubuntu-latest
    # Dry run against the org this pull request will reach next: integration -> SIT, main -> production.
    environment: ${{ github.base_ref == 'main' && 'prod-validate' || 'sit' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli && sf --version
      - name: Log in with the CI certificate (JWT)
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          echo "$SF_JWT_KEY" > "$RUNNER_TEMP/server.key"
          sf org login jwt --client-id "${{ secrets.SF_CLIENT_ID }}" --jwt-key-file "$RUNNER_TEMP/server.key" \
            --username "${{ secrets.SF_USERNAME }}" --instance-url "${{ secrets.SF_INSTANCE_URL }}" --alias target
          rm "$RUNNER_TEMP/server.key"
      - name: Validate deployment and run Apex tests (no changes made to the org)
        run: |
          sf project deploy validate --source-dir force-app --target-org target \
            --test-level RunSpecifiedTests --tests ClientReviewServiceTest \
            --coverage-formatters text --results-dir deploy-results --wait 30
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: validate-results, path: deploy-results }
