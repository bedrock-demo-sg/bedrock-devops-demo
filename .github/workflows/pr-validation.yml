# Quality checks on every pull request into main. Both must pass before merge (branch protection).
name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  code-analyzer:
    name: code-analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install @salesforce/plugin-code-analyzer
          sf --version
      - name: Static analysis (fails on Critical or High)
        run: |
          sf code-analyzer run --config-file code-analyzer.yml --target force-app \
            --severity-threshold 2 --view table \
            --output-file code-analyzer-results.html --output-file code-analyzer-results.sarif
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-results
          path: code-analyzer-results.*

  validate:
    name: validate
    needs: code-analyzer
    runs-on: ubuntu-latest
    # Dry run against production: proves the change deploys and the Apex tests pass, without changing the org.
    environment: prod-validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli && sf --version
      - name: Log in with the CI certificate (JWT)
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          echo "$SF_JWT_KEY" > "$RUNNER_TEMP/server.key"
          sf org login jwt --client-id "${{ secrets.SF_CLIENT_ID }}" --jwt-key-file "$RUNNER_TEMP/server.key" \
            --username "${{ secrets.SF_USERNAME }}" --instance-url "${{ secrets.SF_INSTANCE_URL }}" --alias target
          rm "$RUNNER_TEMP/server.key"
      - name: Validate deployment and run Apex tests (no changes made to the org)
        run: |
          sf project deploy validate --source-dir force-app --target-org target \
            --test-level RunSpecifiedTests --tests ClientReviewServiceTest \
            --coverage-formatters text --results-dir deploy-results --wait 30
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: validate-results, path: deploy-results }
