# Salesforce Code Analyzer v5 configuration.
# Engines and rules use their defaults; only deliberate overrides live here.
# CI gate: sf code-analyzer run --config-file code-analyzer.yml --target force-app --severity-threshold 2
# Severity scale: 1 Critical, 2 High, 3 Moderate, 4 Low, 5 Info. The build fails on 1 or 2.
rules:
  flow:
    # Client_Review_Created must run on every new review, so it has no entry criteria by design.
    # Lowered from High (2) to Moderate (3): still reported, no longer blocks the build.
    TriggerEntryCriteria:
      severity: 3
